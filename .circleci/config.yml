version: 2.1

# (1) orbs가 mirror.yml에 있으면 여기로 합치기
orbs:
  # 예) gh: circleci/github-cli@2.2.0

# (2) executors/commands가 mirror.yml에 있으면 여기로 합치기
executors:
  # ...

commands:
  # ...

jobs:
  # (3) 기존 config.yml의 jobs 그대로
  build:
    docker:
      - image: cimg/base:stable
    steps:
      - checkout
      - run: echo "build..."

  # (4) mirror.yml의 job(예: mirror)을 여기로 복사
  mirror:
    docker:
      - image: cimg/base:stable
    steps:
      - checkout
      - run: echo "mirror..."
      # - run: ./mirror.sh  같은 실제 미러링 스텝

workflows:
  version: 2

  on_push:
    jobs:
      - build

      # (5) mirror job을 같은 workflow에 추가
      - mirror:
          requires:
            - build
          # 필요하면 브랜치 제한
          # filters:
          #   branches:
          #     only: main
